[package]
name        = "sbh-forge"
version     = "0.1.0"
edition     = "2021"
description = "Ephemeral Tool Forge for the Split-Brain Harness: generate, statically analyze, sandbox (WASM/WASI), and reputation-gate LLM-produced Rust tools."
license     = "MIT"
repository  = "https://github.com/bigblue-r4/split-brain-harness"

[lib]
name = "sbh_forge"
path = "src/lib.rs"

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow     = "1.0"
sbh-core   = { path = "../sbh-core", version = "0.1.0" }
sbh-llm    = { path = "../sbh-llm", version = "0.1.0" }
sbh-safety = { path = "../sbh-safety", version = "0.1.0" }
sbh-store  = { path = "../sbh-store", version = "0.1.0" }

[dev-dependencies]
tokio       = { version = "1.38", features = ["macros", "rt", "rt-multi-thread"] }
tempfile    = "3"
async-trait = "0.1"
