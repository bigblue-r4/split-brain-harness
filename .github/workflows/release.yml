name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch; the toolchain input below pins the exact release
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - run: cargo fmt --check
      - run: cargo build
      - run: cargo test
      - run: cargo clippy -- -D warnings

  # NOTE: crates.io publishing is deliberately manual, not blocked.
  # The workspace is publishable as of this commit: every `sbh-*` path dependency
  # carries a version, so `cargo publish --workspace` packages all seven crates in
  # dependency order. It is not wired into this workflow because a crates.io version
  # can never be deleted (only yanked) and the six `sbh-*` names are claimed on first
  # upload — that is a decision to make at a keyboard, not on a tag push. Publish with:
  #     cargo publish --workspace

  create-release:
    name: Create GitHub Release
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found && !/^---$/{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
