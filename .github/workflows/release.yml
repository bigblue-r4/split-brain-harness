name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo build
      - run: cargo test
      - run: cargo clippy -- -D warnings

  # NOTE: crates.io publishing is deliberately manual, not blocked.
  # The workspace is publishable as of this commit: every `sbh-*` path dependency
  # carries a version, so `cargo publish --workspace` packages all seven crates in
  # dependency order. It is not wired into this workflow because a crates.io version
  # can never be deleted (only yanked) and the six `sbh-*` names are claimed on first
  # upload — that is a decision to make at a keyboard, not on a tag push. Publish with:
  #     cargo publish --workspace

  create-release:
    name: Create GitHub Release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found && !/^---$/{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
